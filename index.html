<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flower</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      height: 100vh;
      background: linear-gradient(#87ceeb, #e8f8ff);
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    .flower {
      position: relative;
      width: 200px;
      height: 300px;
    }

    /* Stem */
    .stem {
      position: absolute;
      width: 12px;
      height: 190px;
      background: #2e8b57;
      left: 94px;
      top: 110px;
      border-radius: 10px;
    }

    /* Flower center */
    .center {
      position: absolute;
      width: 65px;
      height: 65px;
      background: #ffd700;
      border-radius: 50%;
      left: 68px;
      top: 60px;
      z-index: 3;
      box-shadow: 0 0 10px #d4a900;
    }

    /* Petals */
    .petal {
      position: absolute;
      width: 70px;
      height: 90px;
      background: #ff4f81;
      border-radius: 50%;
      left: 65px;
      top: 5px;
      transform-origin: 35px 88px;
    }

    .p1 { transform: rotate(0deg); }
    .p2 { transform: rotate(45deg); }
    .p3 { transform: rotate(90deg); }
    .p4 { transform: rotate(135deg); }
    .p5 { transform: rotate(180deg); }
    .p6 { transform: rotate(225deg); }
    .p7 { transform: rotate(270deg); }
    .p8 { transform: rotate(315deg); }

    /* Leaves */
    .leaf {
      position: absolute;
      width: 80px;
      height: 40px;
      background: #32a852;
      border-radius: 80% 0 80% 0;
    }

    .left-leaf {
      left: 15px;
      top: 190px;
      transform: rotate(-25deg);
    }

    .right-leaf {
      right: 15px;
      top: 225px;
      transform: rotate(25deg) scaleX(-1);
    }
  </style>
</head>

<body>

  <div class="flower">

    <div class="petal p1"></div>
    <div class="petal p2"></div>
    <div class="petal p3"></div>
    <div class="petal p4"></div>
    <div class="petal p5"></div>
    <div class="petal p6"></div>
    <div class="petal p7"></div>
    <div class="petal p8"></div>

    <div class="center"></div>

    <div class="stem"></div>

    <div class="leaf left-leaf"></div>
    <div class="leaf right-leaf"></div>

  </div>

</body>
</html>
